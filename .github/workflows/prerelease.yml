name: Prerelease

# Builds unsigned desktop test binaries on every push to main and publishes them
# to a rolling "nightly" pre-release, so the latest main build can be downloaded
# without cutting a version tag. Can also be run manually via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer commit supersedes an in-flight nightly build.
concurrency:
  group: prerelease
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  MLN_CMAKE_CXX_LAUNCHER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache

jobs:
  create-prerelease:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Recreate rolling nightly release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop the previous rolling nightly release + tag, then recreate it as a
          # draft pre-release pointing at the current commit. It is published once
          # all platform builds have uploaded their assets.
          gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          id=$(gh api "repos/${{ github.repository }}/releases" \
            --method POST \
            -f tag_name="nightly" \
            -f target_commitish="${{ github.sha }}" \
            -f name="Nightly (main)" \
            -f body="Automated, unsigned pre-release test build from the latest commit on main (\`${{ github.sha }}\`). macOS: \`xattr -dr com.apple.quarantine\` the app after downloading; Windows: SmartScreen may warn on the unsigned installer." \
            -F draft=true \
            -F prerelease=true \
            --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-latest
          - platform: linux-x86
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja webp jpeg-turbo libpng

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ runner.os }}-sccache-prerelease-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sccache-prerelease-

      - name: Install Trunk
        run: which trunk || cargo install trunk --locked

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-prerelease.outputs.release_id }}
          assetNamePattern: "[name]_[arch][_setup][ext]"

  publish-prerelease:
    needs: [create-prerelease, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ needs.create-prerelease.outputs.release_id }}" \
            --method PATCH -F draft=false >/dev/null
