name: Prerelease

# Builds unsigned desktop test binaries on every push to main and publishes them
# to a rolling "nightly" pre-release, so the latest main build can be downloaded
# without cutting a version tag. Can also be run manually via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer commit supersedes an in-flight nightly build.
concurrency:
  group: prerelease
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # See ci.yml for the caching rationale: the build cache is keyed on the pinned
  # maplibre rev (with a prefix restore-key), and `~/.cargo/git` is cached whole so
  # the Windows vcpkg libs built into the checkout persist. sccache was 0% hit on
  # Windows and rebuilt maplibre's C++ core (~50 min) every nightly.
  CARGO_INCREMENTAL: "0"

jobs:
  create-prerelease:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure rolling nightly release exists
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuse the existing published nightly if present, otherwise create it. It
          # is never deleted, so it stays visible and downloadable while a new build
          # runs; each platform's assets are replaced as its build finishes, and the
          # tag is moved to this commit at the end (publish-prerelease). This avoids
          # the previous delete-then-draft flow, which took the nightly offline for
          # the whole ~50 min build and stranded a draft if a run was cancelled.
          id=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.id' 2>/dev/null || true)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases" \
              --method POST \
              -f tag_name="nightly" \
              -f target_commitish="${{ github.sha }}" \
              -f name="Nightly (main)" \
              -f body="Automated, unsigned pre-release test build from the latest commit on main. macOS: \`xattr -dr com.apple.quarantine\` the app after downloading; Windows: SmartScreen may warn on the unsigned installer." \
              -F draft=false \
              -F prerelease=true \
              --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-latest
          - platform: linux-x86
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja webp jpeg-turbo libpng

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Resolve maplibre rev
        shell: bash
        run: echo "MLN_REV=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          # `-release-`: this builds the release profile (target/release), a
          # separate maplibre build dir from ci.yml's debug `cargo test`, so it
          # must not share ci's key or a cross-profile restore would rebuild the core.
          # Keyed on matrix.platform (not runner.os) so it shares the cache with
          # release.yml's host-native platforms (windows, linux-x86), which build
          # the same target/release. release.yml's --target arches (macos, arm64)
          # build into target/<triple>/ and keep their own lanes.
          key: ${{ matrix.platform }}-cargo-release-mln${{ env.MLN_REV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-release-mln${{ env.MLN_REV }}-

      - name: Install Trunk
        run: which trunk || cargo install trunk --locked

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Crash reporting: baked into the binary at build time via option_env!,
          # so nightly testers' crashes report too. Unset secret → empty → crash
          # reporting compiles out.
          TURNOUT_SENTRY_DSN: ${{ secrets.TURNOUT_SENTRY_DSN }}
          TURNOUT_SENTRY_ENVIRONMENT: nightly
        with:
          releaseId: ${{ needs.create-prerelease.outputs.release_id }}
          assetNamePattern: "[name]_[arch][_setup][ext]"
          # Nightlies are unsigned test builds, so skip updater artifacts — their
          # signature needs TAURI_SIGNING_PRIVATE_KEY (only the tagged release
          # workflow has it), and the auto-updater tracks tagged releases, not
          # this rolling pre-release.
          args: '--config {"bundle":{"createUpdaterArtifacts":false}}'

      # Upload native debug symbols so nightly crash minidumps symbolicate too
      # (matched by debug-id, independent of the tagged release). All three lanes
      # build host-native, so the debug files live in target/release. No-ops when
      # SENTRY_AUTH_TOKEN is unset. Best-effort: continue-on-error so a flaky
      # upload never fails the nightly build.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorlie
          SENTRY_PROJECT: rust
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping debug symbol upload"
            exit 0
          fi
          npm install -g @sentry/cli
          sentry-cli debug-files upload --include-sources target/release

      # Upload the frontend (Leptos wasm + JS bundle) source maps so nightly
      # @sentry/browser-captured frontend stack traces symbolicate too. The SDK
      # reports the release as turnout-tauri@<version> (from src-tauri/Cargo.toml,
      # the same source sentry::release_name!() uses) — the nightly environment
      # tag is separate from the release name — so associate the maps with that
      # release. `dist/` is Trunk's output (Trunk.toml dist = "dist",
      # tauri.conf.json frontendDist = "../dist"), produced by the Tauri build
      # above. sentry-cli is already installed by the debug-symbols step in this
      # job. No-ops without the token; runs per matrix lane (re-upload is
      # idempotent). Best-effort so a missing/empty source-map set never fails
      # the nightly build.
      - name: Upload frontend source maps to Sentry
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorlie
          SENTRY_PROJECT: rust
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping source map upload"
            exit 0
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          REL="turnout-tauri@${VERSION}"
          sentry-cli sourcemaps upload --release "$REL" dist

      # The AppImage upstream excludelist requires the X11/Wayland client
      # libraries to come from the host, never the bundle. maplibre dlopens the
      # host Vulkan driver (RADV/NVIDIA) at runtime; that driver then resolves
      # its own display/GPU deps through the process' LD_LIBRARY_PATH, which
      # AppRun points at the bundle first. Ubuntu-22.04 copies of libxcb/
      # libwayland then shadow the host's and break driver init on newer distros
      # (Arch: VK_ERROR_INCOMPATIBLE_DRIVER). Strip them so the host provides
      # them. Nightly only for now (no updater signature to invalidate); port to
      # the tagged release once verified on hardware.
      - name: Harden AppImage GPU-driver library resolution (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          appimage=$(find target -path '*/bundle/appimage/*.AppImage' | head -n1)
          if [ -z "$appimage" ]; then
            echo "::error::no AppImage produced by the bundler" >&2
            exit 1
          fi
          echo "patching $appimage"

          tooldir=$(mktemp -d)
          curl -fsSL -o "$tooldir/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tooldir/appimagetool"

          work=$(mktemp -d)
          ( cd "$work" && "$OLDPWD/$appimage" --appimage-extract >/dev/null )
          rm -fv "$work"/squashfs-root/usr/lib/libxcb*.so* \
                 "$work"/squashfs-root/usr/lib/libwayland*.so*

          out="$work/Turnout_amd64.AppImage"
          ARCH=x86_64 "$tooldir/appimagetool" --appimage-extract-and-run \
            "$work/squashfs-root" "$out"

          gh release upload nightly "$out" --clobber --repo "${{ github.repository }}"
          echo "re-uploaded hardened AppImage as Turnout_amd64.AppImage"

  publish-prerelease:
    needs: [create-prerelease, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Point the nightly at this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # All platform assets are uploaded. Move the rolling nightly tag to this
          # commit and refresh the notes. The release was already published, so this
          # never toggles visibility — a cancelled run just leaves the tag on the
          # prior commit with the release still live.
          gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
            --method PATCH -f sha="${{ github.sha }}" -F force=true >/dev/null
          gh api "repos/${{ github.repository }}/releases/${{ needs.create-prerelease.outputs.release_id }}" \
            --method PATCH \
            -f body="Automated, unsigned pre-release test build from main (\`${{ github.sha }}\`). macOS: \`xattr -dr com.apple.quarantine\` the app after downloading; Windows: SmartScreen may warn on the unsigned installer." \
            -F draft=false >/dev/null
