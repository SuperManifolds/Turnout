name: AppImage GPU-lib verification

# Temporary verification harness for PR #8. Reproduces the AppImage
# LD_LIBRARY_PATH shadowing failure using Mesa's software Vulkan driver
# (lavapipe) on a newer-than-build host, and proves that stripping the bundled
# X11/Wayland libs restores driver init. lavapipe is a Mesa ICD with the same
# dependency structure as RADV, so it exercises the same failure mode without
# GPU hardware. Runs on demand.

on:
  workflow_dispatch:
  push:
    branches: [fix/appimage-host-display-libs]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Install a newer-than-build Vulkan driver + tools
        run: |
          sudo apt-get update
          # lavapipe (software Vulkan ICD) + loader + tools. On 24.04 these link
          # against newer libzstd/libxcb/libwayland than the AppImage's 22.04
          # bundle, which is exactly the skew that breaks the host driver.
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          echo "host libzstd: $(strings /usr/lib/x86_64-linux-gnu/libzstd.so.1 | grep -oE '1\.[0-9]+\.[0-9]+' | head -1)"
          ls /usr/share/vulkan/icd.d/

      - name: Fetch nightly AppImage (currently un-hardened)
        run: |
          curl -fL --retry 3 -o Turnout.AppImage \
            https://github.com/SuperManifolds/Turnout/releases/download/nightly/Turnout_amd64.AppImage
          chmod +x Turnout.AppImage
          ./Turnout.AppImage --appimage-extract >/dev/null
          echo "bundled libzstd: $(strings squashfs-root/usr/lib/libzstd.so.1 | grep -oE '1\.[0-9]+\.[0-9]+' | head -1)"
          ls squashfs-root/usr/lib | grep -iE 'xcb|wayland|zstd|lzma|elf' || true

      - name: Reproduce + bisect (software Vulkan under AppImage LD_LIBRARY_PATH)
        run: |
          APPDIR="$PWD/squashfs-root"
          LP () { echo "$1/usr/lib/:$1/usr/lib/i386-linux-gnu/:$1/usr/lib/x86_64-linux-gnu/:$1/usr/lib32/:$1/usr/lib64/:$1/lib/:$1/lib/x86_64-linux-gnu/"; }

          # The failure mode we care about is the driver .so failing to LOAD its
          # own deps (a symbol/version error surfaces as ERROR_INCOMPATIBLE_DRIVER
          # or "failed to load ICD"), which happens before device enumeration — so
          # a GPU-less runner still exercises it. We distinguish that from the
          # benign "0 devices" case (RADV loads fine but finds no AMD GPU here).
          probe () { # $1=label  $2=icd path
            echo "::group::$1"
            set +e
            out=$(timeout 30 env VK_ICD_FILENAMES="$2" VK_LOADER_DEBUG=error,warn vulkaninfo --summary 2>&1)
            set -e
            # a genuine driver-load failure prints these; "0 devices" does not
            if echo "$out" | grep -qiE 'failed to load|cannot open shared|undefined symbol|version .* not (defined|found)|GLIBC_[0-9].* not found|CreateInstance failed'; then
              echo "$out" | grep -iE 'failed to load|cannot open|undefined symbol|not (defined|found)|GLIBC_|CreateInstance failed' | head -8
              echo "$1: DRIVER_LOAD_FAIL"
              echo "::endgroup::"; return 1
            fi
            echo "$out" | grep -iE 'deviceName|driverName' | head -4
            echo "$1: driver loaded OK"
            echo "::endgroup::"; return 0
          }

          for icd in lvp_icd radeon_icd; do
            P=/usr/share/vulkan/icd.d/$icd.json
            [ -f "$P" ] || { echo "$icd: ICD json absent, skip"; continue; }
            echo "############## ICD: $icd ##############"

            ( unset LD_LIBRARY_PATH; probe "$icd/control" "$P" ) && echo "${icd}_CONTROL=OK" || echo "${icd}_CONTROL=FAIL"
            ( export LD_LIBRARY_PATH="$(LP "$APPDIR")"; probe "$icd/repro-bundled" "$P" ) && echo "${icd}_REPRO=OK" || echo "${icd}_REPRO=FAIL"
          done

          echo "############## FIX: strip bundled xcb/wayland, re-probe under bundled path ##############"
          mkdir -p _removed
          mv squashfs-root/usr/lib/libxcb*.so* squashfs-root/usr/lib/libwayland*.so* _removed/ 2>/dev/null || true
          for icd in lvp_icd radeon_icd; do
            P=/usr/share/vulkan/icd.d/$icd.json
            [ -f "$P" ] || continue
            ( export LD_LIBRARY_PATH="$(LP "$APPDIR")"; probe "$icd/fixed" "$P" ) && echo "${icd}_FIXED=OK" || echo "${icd}_FIXED=FAIL"
          done
          mv _removed/* squashfs-root/usr/lib/ 2>/dev/null || true

      - name: Validate the repack step used by prerelease.yml
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm -fv squashfs-root/usr/lib/libxcb*.so* squashfs-root/usr/lib/libwayland*.so*
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root Turnout_hardened.AppImage
          chmod +x Turnout_hardened.AppImage
          # prove the repacked image is a valid, extractable AppImage and the libs are gone
          rm -rf squashfs-root
          ./Turnout_hardened.AppImage --appimage-extract >/dev/null
          echo "repacked libxcb/libwayland present?:"
          if ls squashfs-root/usr/lib/libxcb*.so* squashfs-root/usr/lib/libwayland*.so* 2>/dev/null; then
            echo "STILL PRESENT (bad)"; exit 1
          else
            echo "removed (good)"
          fi
