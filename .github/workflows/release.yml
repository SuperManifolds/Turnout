name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases \
            --method POST \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Turnout ${{ github.ref_name }}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-x86
            runner: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: linux-x86
            runner: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            args: ""
            rust_target: ""
          - platform: windows
            runner: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.rust_target && format(',{0}', matrix.rust_target) }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ matrix.platform }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-release-

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      # maplibre-native's darwin cmake path builds with the Ninja generator and
      # links the image libs (webp/png/jpeg) that aren't preinstalled.
      - name: Install build tools (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ninja webp jpeg-turbo libpng

      # maplibre-native's Windows cmake path needs an MSVC environment (its
      # vendored-vcpkg toolchain keys off VCINSTALLDIR), Ninja, and long paths
      # for the deep submodule tree inside the cargo git checkout.
      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Install Trunk
        run: which trunk || cargo install trunk --locked

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          assetNamePattern: "[name]_[arch][_setup][ext]"

  # The bundled AppImage carries Ubuntu-22.04 libxcb*/libwayland*, which shadow
  # the host's newer copies at runtime and break the host Vulkan driver (Arch
  # RADV needs wl_display_create_queue_with_name, absent from the bundled
  # libwayland). Tauri exposes no build-time exclusion, so strip them after the
  # fact. Unlike the nightly, tagged AppImages are signed for auto-update, so the
  # repacked image must be re-signed and latest.json repointed, then verified
  # against the updater public key before publishing (fail-closed).
  #
  # NOTE: this touches production updater signing and cannot be fully exercised
  # off a real signed tag — validate on a throwaway tag (e.g. v0.0.0-rc1) before
  # a real release.
  harden-linux-appimage:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools minisign
          curl -fsSL -o "$HOME/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/appimagetool"
          npm install -g @tauri-apps/cli@^2

      - name: Strip host-provided libs, re-sign, repoint latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          appimagetool="$HOME/appimagetool"
          scripts="$GITHUB_WORKSPACE/.github/scripts"
          pub_line="$(python3 "$scripts/updater_pubkey.py" "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json")"

          work="$(mktemp -d)"; cd "$work"
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json

          harden() {          # $1 = asset name   $2 = latest.json platform key   $3 = ARCH
            local asset="$1" key="$2" arch="$3"
            echo "::group::$asset"
            gh release download "$TAG" --repo "$REPO" --pattern "$asset" --output "$asset"

            python3 "$scripts/appimage_split.py" "$asset" runtime.bin fs.squashfs
            rm -rf squashfs-root
            unsquashfs -d squashfs-root fs.squashfs >/dev/null
            rm -fv squashfs-root/usr/lib/libxcb*.so* squashfs-root/usr/lib/libwayland*.so*

            ARCH="$arch" "$appimagetool" --appimage-extract-and-run squashfs-root "$asset"
            chmod +x "$asset"

            # gate 1: the offending libs are actually gone from the repacked image
            python3 "$scripts/appimage_split.py" "$asset" runtime.bin fs.squashfs
            rm -rf verify-root
            unsquashfs -d verify-root fs.squashfs >/dev/null
            if ls verify-root/usr/lib/libxcb*.so* verify-root/usr/lib/libwayland*.so* 2>/dev/null; then
              echo "::error::libxcb/libwayland still present after repack ($asset)"; exit 1
            fi

            # re-sign with the updater key (env vars are read by the signer)
            rm -f "$asset.sig"
            local out sig
            out="$(tauri signer sign "$asset" 2>&1 || true)"
            if [ -f "$asset.sig" ]; then
              sig="$(cat "$asset.sig")"
            else
              sig="$(printf '%s\n' "$out" | grep -oE '[A-Za-z0-9+/]{100,}={0,2}' | tail -n1 || true)"
              printf '%s' "$sig" > "$asset.sig"
            fi
            [ -n "$sig" ] || { echo "::error::no signature produced for $asset"; printf '%s\n' "$out"; exit 1; }

            # gate 2: the new signature verifies against the updater public key
            printf '%s' "$sig" | base64 -d > "$asset.msig"
            minisign -Vm "$asset" -P "$pub_line" -x "$asset.msig"

            gh release upload "$TAG" --repo "$REPO" --clobber "$asset" "$asset.sig"
            python3 "$scripts/latest_patch.py" latest.json "$key" "$sig"
            echo "::endgroup::"
          }

          harden "Turnout_amd64.AppImage"   linux-x86_64  x86_64
          harden "Turnout_aarch64.AppImage" linux-aarch64 aarch64

          gh release upload "$TAG" --repo "$REPO" --clobber latest.json
          echo "hardened, re-signed, and repointed both Linux AppImages"
