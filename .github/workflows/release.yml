name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases \
            --method POST \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Turnout ${{ github.ref_name }}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-x86
            runner: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: linux-x86
            runner: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            args: ""
            rust_target: ""
          - platform: windows
            runner: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.rust_target && format(',{0}', matrix.rust_target) }}

      - name: Resolve maplibre rev
        shell: bash
        run: echo "MLN_REV=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')" >> "$GITHUB_ENV"

      # Rev-scoped release-profile cache, matching prerelease.yml's key and paths.
      # The host-native platforms (windows, linux-x86) build target/release and so
      # share their cache with the same-named prerelease lanes; the --target arches
      # (macos-*, linux-arm64) build target/<triple>/ and keep their own lanes.
      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ matrix.platform }}-cargo-release-mln${{ env.MLN_REV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-release-mln${{ env.MLN_REV }}-

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      # maplibre-native's darwin cmake path builds with the Ninja generator and
      # links the image libs (webp/png/jpeg) that aren't preinstalled.
      - name: Install build tools (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ninja webp jpeg-turbo libpng

      # maplibre-native's Windows cmake path needs an MSVC environment (its
      # vendored-vcpkg toolchain keys off VCINSTALLDIR), Ninja, and long paths
      # for the deep submodule tree inside the cargo git checkout.
      - name: Set up MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Install Trunk
        run: which trunk || cargo install trunk --locked

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Crash reporting: baked into the binary at build time via option_env!.
          # Unset secret → empty → crash reporting compiles out.
          TURNOUT_SENTRY_DSN: ${{ secrets.TURNOUT_SENTRY_DSN }}
          TURNOUT_SENTRY_ENVIRONMENT: production
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          assetNamePattern: "[name]_[arch][_setup][ext]"

      # Upload native debug symbols so Sentry can symbolicate crash minidumps
      # (function + file:line) instead of showing raw addresses. Runs per matrix
      # lane — each builds a different arch with its own debug-id. No-ops when
      # SENTRY_AUTH_TOKEN is unset. Best-effort: continue-on-error so a flaky
      # upload never fails the build job (which would skip the harden/latest.json
      # step and ship broken Linux auto-update).
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorlie
          SENTRY_PROJECT: rust
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping debug symbol upload"
            exit 0
          fi
          npm install -g @sentry/cli
          if [ -n "${{ matrix.rust_target }}" ]; then
            DIR="target/${{ matrix.rust_target }}/release"
          else
            DIR="target/release"
          fi
          sentry-cli debug-files upload --include-sources "$DIR"

      # Upload the frontend JS (the hand-written bridges + the wasm-bindgen
      # glue, both shipped UNMINIFIED) as artifacts of the release the browser
      # SDK reports (turnout-tauri@<version> from src-tauri/Cargo.toml, matching
      # sentry::release_name!()), so @sentry/browser stack frames render with
      # source context. `dist/` is Trunk's output (Trunk.toml dist = "dist",
      # tauri.conf.json frontendDist = "../dist"), built by the Tauri step above
      # and identical to what ships. sentry-cli only picks up JS/map files, so
      # the 6.6 MB wasm binary is skipped; Trunk emits no .map files because the
      # JS isn't minified (nothing to map).
      #
      # Scope/limits (deliberate): the injected @sentry/browser has NO wasm
      # integration, so wasm panic *frames* cannot be symbolicated here — the
      # Rust panic message + file:line already arrive via the frontend panic
      # hook (sentry_bridge.js), which is the part that matters for triage. True
      # wasm frame symbolication would need a self-hosted SDK + @sentry/wasm +
      # an un-stripped wasm/DWARF upload (tracked separately). Best-effort,
      # token-gated, per-matrix (re-upload is idempotent) — never fails the job.
      - name: Upload frontend JS to Sentry (source context)
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorlie
          SENTRY_PROJECT: rust
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping frontend JS upload"
            exit 0
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          REL="turnout-tauri@${VERSION}"
          sentry-cli sourcemaps upload --release "$REL" dist

  # The bundled AppImage carries Ubuntu-22.04 libxcb*/libwayland*, which shadow
  # the host's newer copies at runtime and break the host Vulkan driver (Arch
  # RADV needs wl_display_create_queue_with_name, absent from the bundled
  # libwayland). Tauri exposes no build-time exclusion, so strip them after the
  # fact. Unlike the nightly, tagged AppImages are signed for auto-update, so the
  # repacked image must be re-signed and latest.json repointed, then verified
  # against the updater public key before publishing (fail-closed).
  #
  # NOTE: this touches production updater signing and cannot be fully exercised
  # off a real signed tag — validate on a throwaway tag (e.g. v0.0.0-rc1) before
  # a real release.
  harden-linux-appimage:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install_harden_tools.sh"

      - name: Strip host-provided libs, re-sign, repoint latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export APPIMAGETOOL="$HOME/appimagetool"
          export SCRIPTS="$GITHUB_WORKSPACE/.github/scripts"
          export PUB_LINE="$(python3 "$SCRIPTS/updater_pubkey.py" "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json")"

          work="$(mktemp -d)"; cd "$work"
          export LATEST_JSON="$work/latest.json"
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json

          bash "$SCRIPTS/harden_appimage.sh" Turnout_amd64.AppImage   linux-x86_64  x86_64
          bash "$SCRIPTS/harden_appimage.sh" Turnout_aarch64.AppImage linux-aarch64 aarch64

          gh release upload "$TAG" --repo "$REPO" --clobber latest.json
          echo "hardened, re-signed, and repointed both Linux AppImages"

  # Create the Sentry release matching the SDK's `turnout-tauri@<version>` name and
  # associate it with the commits since the last release, so Sentry can attribute a
  # crash to a suspect commit. Symbolication itself doesn't need this (debug files
  # match by debug-id); this adds the commit/blame layer. No-ops without the token.
  sentry-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # set-commits --auto walks history for the commit range

      - name: Create Sentry release + set commits
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorlie
          SENTRY_PROJECT: rust
          SENTRY_URL: https://de.sentry.io
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping Sentry release"
            exit 0
          fi
          npm install -g @sentry/cli
          # Derive the release name from the crate version — the same source
          # `sentry::release_name!()` uses (turnout-tauri@$CARGO_PKG_VERSION) — so
          # it always matches what the SDK reports, even if the tag drifts.
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          REL="turnout-tauri@${VERSION}"
          sentry-cli releases new "$REL"
          sentry-cli releases set-commits "$REL" --auto
          sentry-cli releases finalize "$REL"
          sentry-cli releases deploys "$REL" new -e production
