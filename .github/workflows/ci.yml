name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on a ref supersedes an in-flight run: back-to-back merges to
# main no longer race to reserve the same cache keys (one run wins, the other
# fails to save), and a PR force-push cancels its stale run instead of piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # maplibre-native's C++ core (the dominant build cost, ~50 min from scratch on
  # Windows) is a git dependency compiled from source via cmake into the crate's
  # OUT_DIR under `target/`. We cache `target/` + the cargo registry so cargo's
  # build-script fingerprint stays valid and cmake is never re-invoked.
  #
  # The cache key is scoped to the pinned maplibre rev, NOT the full Cargo.lock:
  # the exact key includes the lock hash (fast path when deps are unchanged), but
  # `restore-keys` falls back to the maplibre-rev prefix, so an unrelated
  # dependency change still restores a `target/` with the C++ core already built
  # (cargo then rebuilds only the changed crates, ~1 min). maplibre_native's own
  # build-dir hash depends only on its own deps, so it stays valid across our
  # edits. Only bumping the maplibre rev forces a true cold rebuild. This replaces
  # Swatinem/rust-cache, which is exact-match only: any Cargo.lock or toolchain
  # change missed and rebuilt the core from scratch (~50 min).
  #
  # `~/.cargo/git` is cached whole (not just `git/db`): on Windows maplibre builds
  # its C/C++ deps via vcpkg INTO the git checkout, and `target/` links against
  # those libs (libcurl.lib, icu*.lib, …) by absolute path, so restoring `target/`
  # without the checkout's built libs breaks the link (LNK1181).
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Resolve maplibre rev
        shell: bash
        run: echo "MLN_REV=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          # `-check-` lane, shared with clippy: both are metadata-only. Separate
          # from the test job's key so its built rlibs aren't clobbered.
          key: ${{ runner.os }}-cargo-check-mln${{ env.MLN_REV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-mln${{ env.MLN_REV }}-

      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Resolve maplibre rev
        shell: bash
        run: echo "MLN_REV=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')" >> "$GITHUB_ENV"

      # Shares the `-check-` lane with the check job (same key): both are
      # metadata-only (`cargo check`/`clippy`), kept separate from the test job's
      # key so its built rlibs aren't clobbered by this metadata-only target/.
      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-mln${{ env.MLN_REV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-mln${{ env.MLN_REV }}-

      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to windows-2022: the windows-latest image (VS18 / CMake 4.4,
        # rolled out ~2026-08) breaks maplibre-native's vendored-vcpkg bootstrap
        # ("Downloading vcpkg.exe failed / Access is denied"), failing the mbgl
        # C++ build before CURL is found. windows-2022 has the toolchain mbgl's
        # vcpkg build expects.
        os: [ubuntu-22.04, macos-latest, windows-2022]
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      # maplibre-native's darwin cmake path builds with the Ninja generator.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja webp jpeg-turbo libpng

      # maplibre-native's Windows cmake path needs an MSVC environment (its
      # vendored-vcpkg toolchain keys off VCINSTALLDIR), Ninja, and long paths
      # for the deep submodule tree inside the cargo git checkout.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Resolve maplibre rev
        shell: bash
        run: echo "MLN_REV=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')" >> "$GITHUB_ENV"

      # The test job owns the base `-cargo-mln` key (check/clippy use a separate
      # `-check-` lane). On Linux this matters: check/clippy emit dependency
      # metadata (.rmeta), not codegen (.rlib), so a shared cache would force the
      # test job to codegen the whole dependency graph (~20 min). macOS/Windows are
      # unaffected — the test job is the only one on those runners.
      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mln${{ env.MLN_REV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mln${{ env.MLN_REV }}-

      # turnout-web is a wasm-only frontend crate (no host tests); it is
      # exercised by `trunk build` in the release workflow.
      - run: cargo test --workspace --exclude turnout-web
