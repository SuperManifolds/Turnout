name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on a PR cancels its stale run. Runs on main always finish, since
# main's runs are the only ones that save the build cache (see below): cancelling
# them on back-to-back merges would leave the cache permanently cold.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep test backtraces readable while cutting the debug info that
  # dominates target/ size and link time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # maplibre-native's C++ core (the dominant build cost, 20-50 min from scratch)
  # is a git dependency compiled from source via cmake into the crate's OUT_DIR
  # under `target/`. We cache `target/` + the cargo registry so cargo's
  # build-script fingerprint stays valid and cmake is never re-invoked.
  #
  # The cache key is scoped to the pinned maplibre rev: the exact key includes the
  # lock hash, and `restore-keys` falls back to the maplibre-rev prefix, so an
  # unrelated dependency change still restores a `target/` with the C++ core
  # built. Only bumping the maplibre rev forces a true cold rebuild.
  #
  # `~/.cargo/git` is cached whole (not just `git/db`): on Windows maplibre builds
  # its C/C++ deps via vcpkg INTO the git checkout, and `target/` links against
  # those libs (libcurl.lib, icu*.lib, ...) by absolute path, so restoring
  # `target/` without the checkout's built libs breaks the link (LNK1181). The
  # build script also marks the checkout rerun-if-changed, so it must be present.
  #
  # Each lane is ~3 GB and the repo gets 10 GB of cache before the Actions budget
  # makes it read-only, so only main saves: one lane per OS, with the lane's older
  # entries deleted right before saving. PRs restore main's lanes (a PR can read
  # its base branch's caches) but never save, since a PR's cache is visible only
  # to that PR and would crowd out main's.
  CACHE_PATHS: |
    ~/.cargo/registry/index
    ~/.cargo/registry/cache
    ~/.cargo/git
    target

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Deleting superseded cache entries on main.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # Pinned to windows-2022: the windows-latest image (VS18 / CMake 4.4,
        # rolled out ~2026-08) breaks maplibre-native's vendored-vcpkg bootstrap
        # ("Downloading vcpkg.exe failed / Access is denied"), failing the mbgl
        # C++ build before CURL is found. windows-2022 has the toolchain mbgl's
        # vcpkg build expects.
        os: [ubuntu-22.04, macos-latest, windows-2022]
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      # maplibre-native's darwin cmake path builds with the Ninja generator.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja webp jpeg-turbo libpng

      # maplibre-native's Windows cmake path needs an MSVC environment (its
      # vendored-vcpkg toolchain keys off VCINSTALLDIR), Ninja, and long paths
      # for the deep submodule tree inside the cargo git checkout.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Resolve cache key
        shell: bash
        run: |
          rev=$(grep -oE 'maplibre-native-rs\?rev=[0-9a-f]+' Cargo.lock | head -1 | sed 's/.*rev=//')
          echo "CACHE_LANE=${{ runner.os }}-cargo-mln" >> "$GITHUB_ENV"
          echo "CACHE_PREFIX=${{ runner.os }}-cargo-mln${rev}-" >> "$GITHUB_ENV"

      - name: Restore cargo + target
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ env.CACHE_PREFIX }}${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      # Point vcpkg's downloads at a stable path and cache it on a rev-independent
      # key, so the package source tarballs (curl, ICU, ...) survive an mbgl rev
      # bump, which changes the cargo-cache key above and would otherwise force a
      # full re-download of every source through the flaky vendored-vcpkg path. The
      # fork's Get-VendorPackages retry covers a cold-cache/bootstrap blip.
      - name: Set vcpkg downloads dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VCPKG_DOWNLOADS=$GITHUB_WORKSPACE/vcpkg-downloads" >> "$GITHUB_ENV"

      - name: Cache vcpkg downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-downloads-v1

      # Clippy runs in the Linux test job so the C++ core is built once per run:
      # check-mode and test builds share the build script's output. Clippy with
      # --all-targets covers everything `cargo check --all-targets` does.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      # turnout-web is a wasm-only frontend crate (no host tests); it is
      # exercised by `trunk build` in the release workflow.
      - run: cargo test --workspace --exclude turnout-web

      - name: Delete superseded cache entries (main)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$CACHE_LANE" --limit 100 --json id,key \
            --jq '.[] | "\(.id) \(.key)"' | while read -r id key; do
            echo "deleting $key"
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Save cargo + target (main)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
