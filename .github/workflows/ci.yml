name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # maplibre-native's C++ core (the dominant build cost, ~50 min from scratch on
  # Windows) is a git dependency compiled from source via cmake into the crate's
  # OUT_DIR. Swatinem/rust-cache persists `target/` and the cargo registry keyed
  # on Cargo.lock, so on a cache hit cargo's build-script fingerprint stays valid
  # and cmake is never re-invoked. This replaces sccache, whose MSVC compilation
  # hashing produced a 0% hit rate on Windows (absolute paths / generated headers
  # in the cmake build defeat its caching), leaving the core rebuilt every run.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - run: cargo check --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Second line: maplibre-native core build deps (compiled from source by maplibre_native's build.rs)
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake pkg-config libcurl4-openssl-dev libuv1-dev libpng-dev libjpeg-turbo8-dev libwebp-dev libicu-dev libgl1-mesa-dev libegl1-mesa-dev \
            glslang-dev glslang-tools

      # maplibre-native's darwin cmake path builds with the Ninja generator.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja webp jpeg-turbo libpng

      # maplibre-native's Windows cmake path needs an MSVC environment (its
      # vendored-vcpkg toolchain keys off VCINSTALLDIR), Ninja, and long paths
      # for the deep submodule tree inside the cargo git checkout.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # turnout-web is a wasm-only frontend crate (no host tests); it is
      # exercised by `trunk build` in the release workflow.
      - run: cargo test --workspace --exclude turnout-web
