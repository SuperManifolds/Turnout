[package]
name = "turnout-tauri"
version = "0.3.1"
edition = "2024"

[lints]
workspace = true

[dependencies]
turnout-core = { path = "../core" }
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tiny-skia = "0.11"
futures = "0.3"
# Used only to enumerate the machine's GPUs for the settings picker (list_gpus).
# NOT the maplibre `wgpu` backend feature (that upstream backend does not build);
# the wgpu crate on its own reads adapter names fine.
wgpu = "29.0.0"
lru = "0.12"
quick-xml = "0.37"
tokio = { version = "1", features = ["net"] }
rusqlite = { version = "0.34", features = ["bundled"] }
maplibre_native = { git = "https://github.com/SuperManifolds/maplibre-native-rs", rev = "58fa28a", features = ["json", "tokio"] }
mvt = "0.13.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Crash reporting. rustls transport only — no native-tls/openssl, matching the
# app's rustls-only reqwest. tauri-plugin-sentry re-exports sentry-rust-minidump
# (native crash capture) and injects @sentry/browser into the webview.
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls", "release-health", "tracing", "logs"] }
tauri-plugin-sentry = "0.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
