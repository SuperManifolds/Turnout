[package]
name = "nimby-gen-web"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
nimby-gen-core = { path = "../core" }
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "MouseEvent",
    "Event",
    "console",
    "SubmitEvent",
    "Response",
    "Headers",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "ClipboardEvent",
    "DataTransfer",
] }
console_error_panic_hook = "0.1"
