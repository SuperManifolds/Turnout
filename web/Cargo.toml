[package]
name = "turnout-web"
version = "0.4.1"
edition = "2024"

[lints]
workspace = true

[dependencies]
turnout-core = { path = "../core" }
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "DomRect",
    "HtmlElement",
    "HtmlInputElement",
    "Event",
    "console",
    "SubmitEvent",
    "Response",
    "ClipboardEvent",
    "DataTransfer",
    "Storage",
    "Navigator",
    "Clipboard",
] }
console_error_panic_hook = "0.1"
