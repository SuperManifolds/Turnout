[workspace]
members = ["core", "cli", "web", "src-tauri", "bench"]
resolver = "3"

# Dependencies stay optimized in dev builds — the PNG encoder sits on the tile
# hot path and is unusably slow at opt-level 0. Workspace crates keep the
# default 0 for fast incremental compiles.
[profile.dev.package."*"]
opt-level = 2

# Retain line-number debug info in release builds so Sentry can symbolicate native
# crash minidumps (function + file:line) after `sentry-cli debug-files upload` in
# CI. Function names come from the symbol table; this adds the line tables at a
# modest size cost. Does not affect the C++ maplibre core (built via its own cmake).
[profile.release]
debug = "line-tables-only"

[workspace.lints.clippy]
complexity = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
pedantic = "warn"
unwrap_used = { level = "warn", priority = 1 }
implicit_hasher = { level = "allow", priority = 1 }
manual_midpoint = { level = "allow", priority = 1 }
float_cmp = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
many_single_char_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
